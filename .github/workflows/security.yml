name: Security checks

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read
  security-events: write

jobs:
  application-security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm audit --omit=dev --audit-level=high
      - run: npm run typecheck
      - run: npm run verify:security
      # The commercial gitleaks-action wrapper requires an organization
      # license. Run the same open-source scanner directly so personal and
      # organization forks enforce one license-independent secret scan.
      - name: Scan Git history for secrets
        uses: docker://ghcr.io/gitleaks/gitleaks:v8.28.0
        with:
          args: detect --source=/github/workspace --no-banner --redact --verbose
